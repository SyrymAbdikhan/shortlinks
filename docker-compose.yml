version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: shortlinks-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortlinks}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shortlinks} -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 3

  app:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@shortlinks-db:5432/${POSTGRES_DB:-shortlinks}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
